    #     working-directory: backend
    #     run: go build -v ./...

    # - name: Scan backend code (Anchore)
    #   uses: anchore/scan-action@v7
    #   id: scan
    #   with:
    #     path: "backend"
    #     fail-build: false
    #     severity-cutoff: high

    # - name: Upload backend code scan SARIF report
    #   uses: github/codeql-action/upload-sarif@v4
    #   with:
    #     sarif_file: ${{ steps.scan.outputs.sarif }}
    #     category: backend-code

  package:
    name: Package and Publish
    needs: [build]
    runs-on:
      ubuntu-24.04
      # AWS_* / ECR_REPOSITORY_URL come from the selected GitHub environment.
    environment: ${{ inputs.environment || 'dev' }}
    permissions:
      contents: read
      security-events: write
    env:
      # ECR repository URL from `terraform output ecr_repository_url`. The tag is the commit SHA.
      IMAGE: ${{ vars.ECR_REPOSITORY_URL }}:${{ github.sha }}
      AWS_REGION: ${{ vars.AWS_REGION }}
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      # ECR tags are immutable and a commit SHA always maps to the same code, so an already
      # published SHA is skipped (safe re-runs).
      - name: Check if the image is already published
        id: exists
        run: |
          repo="${ECR_REPOSITORY_URL#*/}"
          if aws ecr describe-images --repository-name "$repo" --image-ids imageTag="${{ github.sha }}" >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "Image tag ${{ github.sha }} is already in ECR, skipping build and push."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          ECR_REPOSITORY_URL: ${{ vars.ECR_REPOSITORY_URL }}

      - name: Set up Docker Buildx
        if: steps.exists.outputs.published != 'true'
        uses: docker/setup-buildx-action@v4

      # Lightsail runs on amd64.
      - name: Build container image
        if: steps.exists.outputs.published != 'true'
        run: docker buildx build --platform linux/amd64 --load -t "$IMAGE" -f backend/docker/app-prod/Dockerfile backend

      # - name: Scan backend image (Anchore)
      #   if: steps.exists.outputs.published != 'true'
      #   uses: anchore/scan-action@v7
      #   id: scan
      #   with:
      #     image: ${{ env.IMAGE }}
      #     fail-build: false
      #     severity-cutoff: high

      # - name: Upload backend image scan SARIF report
      #   if: steps.exists.outputs.published != 'true'
      #   uses: github/codeql-action/upload-sarif@v4
      #   with:
      #     sarif_file: ${{ steps.scan.outputs.sarif }}
      #     category: backend-image

      - name: Log in to Amazon ECR
        if: steps.exists.outputs.published != 'true'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Publish image
        if: steps.exists.outputs.published != 'true'
        run: docker push "$IMAGE"

      - name: Set image output
        id: meta
        run: |
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          {
            echo "### Backend image"
            echo "Tag to deploy: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
