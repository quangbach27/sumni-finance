name: Backend Commit Stage
on:
  workflow_call:
    outputs:
      image:
        description: "Published image (repository:sha)"
        value: ${{ jobs.package.outputs.image }}
  workflow_dispatch:

env:
  VERSION: ${{ github.sha }}

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: sumni-finance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "backend/go.mod"
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Check go.mod / go.sum are tidy
        working-directory: backend
        run: |
          make tidy
          git diff --exit-code go.mod go.sum

      - name: Lint
        working-directory: backend
        run: make lint

      - name: Test
        working-directory: backend
        run: make test

      - name: Build
        working-directory: backend
        run: go build -v ./...

      - name: Scan backend code (Anchore)
        uses: anchore/scan-action@v7
        id: scan
        with:
          path: "backend"
          fail-build: false
          severity-cutoff: high

      - name: Upload backend code scan SARIF report
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          category: backend-code

  package:
    name: Package and Publish
    needs: [build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      security-events: write
    env:
      REGISTRY: ghcr.io
      # The only artifact of this stage, in GHCR. The tag is the commit SHA.
      # Deploy Backend pulls it and pushes it to the Lightsail registry.
      IMAGE: ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Log into container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A commit SHA always maps to the same code, so an already published SHA is skipped
      # (safe re-runs).
      - name: Check if the image is already published
        id: exists
        run: |
          if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
            echo "ghcr=true" >> "$GITHUB_OUTPUT"
            echo "Image is already in GHCR, skipping build and push."
          else
            echo "ghcr=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.exists.outputs.ghcr != 'true'
        uses: docker/setup-buildx-action@v4

      # Lightsail runs on amd64.
      - name: Build container image
        if: steps.exists.outputs.ghcr != 'true'
        run: docker buildx build --platform linux/amd64 --load -t "$IMAGE" -f backend/docker/app-prod/Dockerfile backend

      - name: Scan backend image (Anchore)
        if: steps.exists.outputs.ghcr != 'true'
        uses: anchore/scan-action@v7
        id: scan
        with:
          image: ${{ env.IMAGE }}
          fail-build: false
          severity-cutoff: high

      - name: Upload backend image scan SARIF report
        if: steps.exists.outputs.ghcr != 'true'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          category: backend-image

      - name: Publish image to GHCR
        if: steps.exists.outputs.ghcr != 'true'
        run: docker push "$IMAGE"

      - name: Set image output
        id: meta
        run: |
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          {
            echo "### Backend image"
            echo "Tag to deploy: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
