name: Backend Commit Stage
on:
  workflow_call:
    inputs:
      environment:
        description: "Environment to publish to"
        type: string
        required: false
        default: dev
    outputs:
      image:
        description: "Published image (repository:sha)"
        value: ${{ jobs.package.outputs.image }}
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to publish to"
        type: choice
        options:
          - dev
        default: dev

env:
  VERSION: ${{ github.sha }}

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
