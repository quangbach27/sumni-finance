name: Deploy Web
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to"
        type: choice
        options:
          - dev
        default: dev

# Never run two deployments to the same environment at the same time.
concurrency:
  group: deploy-web-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  commit-stage:
    name: Commit stage
    uses: ./.github/workflows/web-commit-stage.yml
    permissions:
      contents: read
      security-events: write
    with:
      environment: ${{ inputs.environment }}

  deploy:
    name: Deploy to S3 + CloudFront (${{ inputs.environment }})
    needs: [commit-stage]
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v5
        with:
          name: ${{ needs.commit-stage.outputs.artifact-name }}
          path: web/dist

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      # Exports LIGHTSAIL_SERVICE, DB_*, *_ARN, WEB_*, VITE_API_BASE_URL from `terraform output`.
      - name: Load infra values from Terraform
        uses: ./.github/actions/terraform-outputs

      - name: Sync hashed assets to S3
        run: |
          aws s3 sync web/dist "s3://$WEB_BUCKET" \
            --delete \
            --exclude index.html \
            --cache-control "public,max-age=31536000,immutable"

      - name: Upload index.html
        # Uploaded last and never cached, so clients always get the newest asset hashes.
        run: |
          aws s3 cp web/dist/index.html "s3://$WEB_BUCKET/index.html" \
            --cache-control "no-cache" \
            --content-type "text/html"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$WEB_DISTRIBUTION_ID" \
            --paths "/*" > /dev/null

      - name: Summary
        run: |
          {
            echo "### Web deployed (${{ inputs.environment }})"
            echo "- Bucket: \`$WEB_BUCKET\`"
            echo "- URL: $WEB_URL"
          } >> "$GITHUB_STEP_SUMMARY"
