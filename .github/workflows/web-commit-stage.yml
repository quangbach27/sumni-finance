name: Web Commit Stage
on:
  workflow_call:
    inputs:
      environment:
        description: "Environment whose variables (VITE_*) are used for the build"
        type: string
        required: false
        default: dev
    outputs:
      artifact-name:
        description: "Name of the uploaded artifact that contains the web dist"
        value: ${{ jobs.build.outputs.artifact-name }}
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment whose variables (VITE_*) are used for the build"
        type: choice
        options:
          - dev
        default: dev

env:
  VERSION: ${{ github.sha }}

jobs:
  build:
    name: Build and Test
    if: github.event_name == 'push' || (!github.event.pull_request.draft && !contains(github.event.pull_request.labels.*.name, 'skip-ci'))
    runs-on: ubuntu-24.04
    # Vite inlines VITE_* at build time, so the values come from the
    # variables of the selected environment.
    environment: ${{ inputs.environment || 'dev' }}
    permissions:
      contents: read
      security-events: write
    outputs:
      artifact-name: ${{ steps.meta.outputs.artifact-name }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Lint
        working-directory: web
        run: npm run lint

      #   - name: Test
      #     working-directory: web
      #     run: npm run test

      - name: Build
        working-directory: web
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}

      - uses: anchore/scan-action@v7
        id: scan
        with:
          path: "web"
          fail-build: false
          severity-cutoff: high

      - name: Upload Anchore scan SARIF report
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          category: web-lib

      - name: Set artifact name
        id: meta
        run: echo "artifact-name=web-dist-${{ env.VERSION }}" >> "$GITHUB_OUTPUT"

      - name: Upload dist artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.meta.outputs.artifact-name }}
          path: web/dist
          if-no-files-found: error
          retention-days: 7
