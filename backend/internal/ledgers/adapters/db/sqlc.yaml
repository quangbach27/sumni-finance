version: "2"
sql:
  - engine: "postgresql"
    queries: "queries"
    schema: "migrations"
    gen:
      go:
        package: "dbmodels"
        out: "dbmodels"
        sql_package: "pgx/v5"
        emit_empty_slices: true
        emit_pointers_for_null_types: true
        overrides:
          # Domain type overrides
          - column: "ledgers.fund_sources.uuid"
            go_type:
              import: "backend/internal/ledgers/domain"
              type: "FundSourceUUID"

          - column: "ledgers.fund_sources.type"
            go_type:
              import: "backend/internal/ledgers/domain"
              type: "FundSourceType"

          - column: "ledgers.ledger_periods.uuid"
            go_type:
              import: "backend/internal/ledgers/domain"
              type: "LedgerPeriodUUID"

          - column: "ledgers.ledger_periods.status"
            go_type:
              import: "backend/internal/ledgers/domain"
              type: "LedgerStatus"

          - column: "ledgers.fund_source_statements.uuid"
            go_type:
              import: "backend/internal/ledgers/domain"
              type: "FundSourceStatementUUID"

          - column: "ledgers.fund_source_statements.ledger_period_uuid"
            go_type:
              import: "backend/internal/ledgers/domain"
              type: "LedgerPeriodUUID"

          - column: "ledgers.fund_source_statements.fund_source_uuid"
            go_type:
              import: "backend/internal/ledgers/domain"
              type: "FundSourceUUID"

          - column: "ledgers.ledger_entries.uuid"
            go_type:
              import: "backend/internal/ledgers/domain"
              type: "LedgerEntryUUID"

          - column: "ledgers.ledger_entries.ledger_period_uuid"
            go_type:
              import: "backend/internal/ledgers/domain"
              type: "LedgerPeriodUUID"

          - column: "ledgers.ledger_entries.fund_source_uuid"
            go_type:
              import: "backend/internal/ledgers/domain"
              type: "FundSourceUUID"

          - column: "ledgers.ledger_entries.direction"
            go_type:
              import: "backend/internal/shared"
              type: "Direction"

          - column: "ledgers.ledger_entries.status"
            go_type:
              import: "backend/internal/ledgers/domain"
              type: "EntryStatus"

          - column: "ledgers.ledger_entries.kind"
            go_type:
              import: "backend/internal/ledgers/domain"
              type: "EntryKind"

          - column: "ledgers.ledger_entries.category_uuid"
            go_type:
              import: "backend/internal/ledgers/domain"
              type: "CategoryUUID"
              pointer: true

          - column: "ledgers.ledger_entries.reversed_by_entry_uuid"
            go_type:
              import: "backend/internal/ledgers/domain"
              type: "LedgerEntryUUID"
              pointer: true

          - column: "ledgers.ledger_entries.reverses_entry_uuid"
            go_type:
              import: "backend/internal/ledgers/domain"
              type: "LedgerEntryUUID"
              pointer: true

          # Common type overrides
          - db_type: "timestamptz"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true

          - db_type: "timestamptz"
            go_type:
              import: "time"
              type: "Time"

          - db_type: "pg_catalog.numeric"
            go_type:
              import: "github.com/shopspring/decimal"
              type: "Decimal"

          - db_type: "pg_catalog.numeric"
            nullable: true
            go_type:
              import: "github.com/shopspring/decimal"
              type: "Decimal"
              pointer: true

          - db_type: "uuid"
            go_type:
              import: "github.com/quangbach27/golang-common"
              type: "UUID"

          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/quangbach27/golang-common"
              type: "UUID"
              pointer: true
