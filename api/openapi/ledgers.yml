openapi: 3.0.3
info:
  title: Ledgers API
  version: 1.0.0

tags:
  - name: fund-sources
  - name: ledger-periods

paths:
  /api/v1/fund-sources:
    get:
      tags: [fund-sources]
      operationId: listFundSources
      summary: List fund sources
      responses:
        "200":
          description: List of fund sources
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListFundSourcesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags: [fund-sources]
      operationId: createFundSource
      summary: Create a fund source
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFundSourceRequest"
      responses:
        "201":
          description: Fund source created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateFundSourceResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/ledger-periods:
    get:
      tags: [ledger-periods]
      operationId: listLedgerPeriods
      summary: List ledger periods
      description: Newest period (by open date) first.
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: status
          in: query
          required: false
          explode: false
          schema:
            $ref: "#/components/schemas/LedgerStatus"
      responses:
        "200":
          description: A page of ledger periods
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListLedgerPeriodsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags: [ledger-periods]
      operationId: openLedgerPeriod
      summary: Open a ledger period
      description: >
        Opens a new period. Fails with 409 while an unlocked (not reconciled)
        period exists. The opening balance is taken from the fund sources.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenLedgerPeriodRequest"
      responses:
        "201":
          description: Ledger period opened
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenLedgerPeriodResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"

components:
  schemas:
    FundSourceUUID:
      type: string
      format: uuid
      x-go-type: domain.FundSourceUUID
      x-go-type-import:
        path: backend/internal/ledgers/domain

    FundSourceType:
      type: string
      enum: [bank, cash]
      x-go-type: domain.FundSourceType
      x-go-type-import:
        path: backend/internal/ledgers/domain

    Currency:
      type: string
      enum: [VND]
      x-go-type: shared.Currency
      x-go-type-import:
        path: backend/internal/shared

    Decimal:
      type: number
      x-go-type: decimal.Decimal
      x-go-type-import:
        path: github.com/shopspring/decimal

    FundSourceDetails:
      type: object
      required: [owner_name]
      properties:
        owner_name:
          type: string
        bank_code:
          type: string
          description: Bank only.
        bank_bin:
          type: integer
          format: int32
          description: Bank only.
        bank_short_name:
          type: string
          description: Bank only.
        account_number:
          type: string
          description: Bank only.

    FundSource:
      type: object
      required: [uuid, name, type, balance, currency, details]
      properties:
        uuid:
          $ref: "#/components/schemas/FundSourceUUID"
        name:
          type: string
        type:
          $ref: "#/components/schemas/FundSourceType"
        balance:
          $ref: "#/components/schemas/Decimal"
        currency:
          $ref: "#/components/schemas/Currency"
        details:
          $ref: "#/components/schemas/FundSourceDetails"

    ListFundSourcesResponse:
      type: object
      required: [fund_sources]
      properties:
        fund_sources:
          type: array
          items:
            $ref: "#/components/schemas/FundSource"

    CreateFundSourceRequest:
      type: object
      required: [name, type, start_balance, currency, details]
      properties:
        name:
          type: string
        type:
          $ref: "#/components/schemas/FundSourceType"
        start_balance:
          $ref: "#/components/schemas/Decimal"
        currency:
          $ref: "#/components/schemas/Currency"
        details:
          $ref: "#/components/schemas/FundSourceDetails"

    CreateFundSourceResponse:
      type: object
      required: [fund_source_uuid]
      properties:
        fund_source_uuid:
          $ref: "#/components/schemas/FundSourceUUID"

    LedgerPeriodUUID:
      type: string
      format: uuid
      x-go-type: domain.LedgerPeriodUUID
      x-go-type-import:
        path: backend/internal/ledgers/domain

    LedgerStatus:
      type: string
      enum: [opened, closed, reconciled]
      x-go-type: domain.LedgerStatus
      x-go-type-import:
        path: backend/internal/ledgers/domain

    PageInfo:
      type: object
      required: [page, page_size, total_count]
      properties:
        page:
          type: integer
        page_size:
          type: integer
        total_count:
          type: integer

    LedgerPeriod:
      type: object
      required: [uuid, name, opening_balance, open_date, close_date, status]
      properties:
        uuid:
          $ref: "#/components/schemas/LedgerPeriodUUID"
        name:
          type: string
        opening_balance:
          $ref: "#/components/schemas/Decimal"
        closing_balance:
          allOf:
            - $ref: "#/components/schemas/Decimal"
          description: Set once the period is reconciled.
        open_date:
          type: string
          format: date-time
        close_date:
          type: string
          format: date-time
        status:
          $ref: "#/components/schemas/LedgerStatus"
        reopen_reason:
          type: string
        reopened_at:
          type: string
          format: date-time
        reconciled_at:
          type: string
          format: date-time

    ListLedgerPeriodsResponse:
      type: object
      required: [items, page_info]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/LedgerPeriod"
        page_info:
          $ref: "#/components/schemas/PageInfo"

    OpenLedgerPeriodRequest:
      type: object
      required: [name, open_date, close_date, fund_source_uuids]
      properties:
        name:
          type: string
        open_date:
          type: string
          format: date-time
        close_date:
          type: string
          format: date-time
        fund_source_uuids:
          type: array
          items:
            $ref: "#/components/schemas/FundSourceUUID"

    OpenLedgerPeriodResponse:
      type: object
      required: [ledger_period_uuid]
      properties:
        ledger_period_uuid:
          $ref: "#/components/schemas/LedgerPeriodUUID"

    ErrorDetail:
      type: object
      required: [error_slug, message]
      properties:
        entity_id:
          type: string
        entity_type:
          type: string
        error_slug:
          type: string
        message:
          type: string

    ErrorResponse:
      type: object
      required: [slug, message]
      properties:
        slug:
          type: string
        message:
          type: string
        details:
          type: array
          items:
            $ref: "#/components/schemas/ErrorDetail"

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    Conflict:
      description: Request conflicts with the current state
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    InternalServerError:
      description: Server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
